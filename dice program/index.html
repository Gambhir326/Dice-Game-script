<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0da429;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #090909;
        }
        .dice {
            font-size: 100px;
        }
        .result {
            font-size: 24px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            margin-top: 20px;
            cursor: pointer;
        }
        block{
            display: inline-block;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Dice Game</h1>
    <div class="block">
        <div>
            <h2>player 1</h2>
            <span id="player1Dice" class="dice">🎲</span>
        </div>
        <!-- <display: flex; justify-content: center; align-items: center; margin: 20px 0;">
            <h2></h2> -->
        <div>
            <h2>player 2</h2>
            <span id="player2Dice" class="dice">🎲</span>
            </div>
        <!-- <p><h2>player 1 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; player 2</h2></p>
        <span id="player1Dice" class="dice">🎲</span>
        <span id="player2Dice" class="dice">🎲</span> -->
    </div>
    <div class="result" id="result">Click "Roll Dice" to start the game!</div>
    <button onclick="rollDice()">Roll Dice</button>

    <script src="main.js"></script>
</body>
</html>
