<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0da429;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 24px;
        }

        .block {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            margin: 30px 0;
        }

        .player-card {
            background: rgba(0, 0, 0, 0.25);
            padding: 20px 30px;
            border-radius: 12px;
            min-width: 140px;
        }

        .player-card h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
            text-transform: capitalize;
        }

        .dice {
            font-size: 90px;
            display: inline-block;
            user-select: none;
        }

        .result {
            font-size: 24px;
            font-weight: bold;
            margin-top: 25px;
            min-height: 36px;
        }

        button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #ffffff;
            color: #121212;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>Dice Game</h1>

    <div class="block">
        <div class="player-card">
            <h2>Player 1</h2>
            <span id="player1Dice" class="dice">🎲</span>
        </div>
        <div class="player-card">
            <h2>Player 2</h2>
            <span id="player2Dice" class="dice">🎲</span>
        </div>
    </div>

    <div class="result" id="result">Click "Roll Dice" to start the game!</div>
    <button type="button" id="rollBtn">Roll Dice</button>

    <script>
        function getDiceEmoji(number) {
            const diceEmojis = ["🎲", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
            return diceEmojis[number];
        }

        function rollDice() {
            const player1Roll = Math.floor(Math.random() * 6) + 1;
            const player2Roll = Math.floor(Math.random() * 6) + 1;

            const p1Element = document.getElementById('player1Dice');
            const p2Element = document.getElementById('player2Dice');
            const resultElement = document.getElementById('result');

            p1Element.textContent = getDiceEmoji(player1Roll);
            p2Element.textContent = getDiceEmoji(player2Roll);

            if (player1Roll > player2Roll) {
                resultElement.textContent = "Player 1 Wins! 🎉";
            } else if (player2Roll > player1Roll) {
                resultElement.textContent = "Player 2 Wins! 🎉";
            } else {
                resultElement.textContent = "It's a Tie! 🤝";
            }
        }

        // Attach listener directly to avoid inline onclick reference issues
        document.getElementById('rollBtn').addEventListener('click', rollDice);
    </script>
</body>
</html>
